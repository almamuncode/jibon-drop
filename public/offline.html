<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ইন্টারনেট সংযোগ নেই · জীবনড্রপ</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f5f5;
        color: #211b1d;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 360px;
        padding: 32px;
        margin: 20px;
        background: white;
        border-radius: 28px;
      }
      h1 {
        font-size: 28px;
        line-height: 1.2;
      }
      p {
        color: #736b6e;
      }
      a {
        display: inline-block;
        background: #df0715;
        color: white;
        padding: 12px 24px;
        border-radius: 99px;
        text-decoration: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #161214;
          color: #f4edef;
        }
        main {
          background: #211b1e;
        }
        p {
          color: #b9adb2;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <strong>জীবনড্রপ</strong>
      <h1>ইন্টারনেট সংযোগ নেই</h1>
      <p>
        রক্তদাতা খুঁজতে ও অ্যাকাউন্ট পরিচালনা করতে আবার ইন্টারনেটের সঙ্গে যুক্ত
        হন। রক্তদাতার আগ্রহ ও যোগাযোগের তথ্য দেখতে ইন্টারনেট সংযোগ প্রয়োজন।
      </p>
      <a href="/">আবার চেষ্টা করুন</a>
    </main>
    <script>
      if (
        document.cookie
          .split(";")
          .some((part) => part.trim() === "jibondrop-language=en")
      ) {
        document.documentElement.lang = "en";
        document.title = "You’re offline · JibonDrop";
        document.querySelector("strong").textContent = "JibonDrop";
        document.querySelector("h1").textContent = "You’re offline";
        document.querySelector("p").textContent =
          "Reconnect to search donors and manage your account. Donor availability and contact information need a live connection.";
        document.querySelector("a").textContent = "Try again";
      }
    </script>
  </body>
</html>
